# LOCAL-FILES version: mounts the app and nginx config from folders on TrueNAS. Use docker-compose.yml (pulls the
# ready-made image from GitHub) unless you specifically want to manage those files by hand.
# Replace /mnt/POOL/book-sale with your dataset path.
services:
  book-sale:
    image: nginxinc/nginx-unprivileged:alpine     # pin an exact version tag once you have chosen one
    container_name: book-sale
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:8080"                     # host-only; Tailscale provides the HTTPS front (README step 5)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/POOL/book-sale/app:/usr/share/nginx/html:ro
      - /mnt/POOL/book-sale/data:/data:ro
      - /mnt/POOL/book-sale/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/POOL/book-sale/nginx/security-headers.inc:/etc/nginx/security-headers.inc:ro
