# Sale Lookup: the store app container. Static files only; it has no database and no access to Shelf.
# TrueNAS SCALE: Apps -> Discover Apps -> Custom App -> "Install via YAML" (paste this), or `docker compose up -d`.
# Replace /mnt/POOL/store-app with your dataset path (see README step 1).
services:
  sale-lookup:
    image: nginxinc/nginx-unprivileged:alpine     # pin an exact version tag once you have chosen one
    container_name: sale-lookup
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:8080"                     # host-only; Tailscale provides the HTTPS front (README step 5)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/POOL/store-app/app:/usr/share/nginx/html:ro
      - /mnt/POOL/store-app/data:/data:ro
      - /mnt/POOL/store-app/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /mnt/POOL/store-app/nginx/security-headers.inc:/etc/nginx/security-headers.inc:ro
