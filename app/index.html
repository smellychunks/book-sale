<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Sale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1F5FBF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Book Sale">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <button id="pill" class="pill" type="button" aria-expanded="false" aria-controls="panel" data-state="empty"><span class="dot"></span><span id="pillText">Loading…</span></button>
  <div id="panel" class="panel" hidden>
    <dl>
      <dt>Library</dt><dd id="pCount">–</dd>
      <dt>Last synced</dt><dd id="pSynced">–</dd>
      <dt>Library copy from</dt><dd id="pGenerated">–</dd>
      <dt>Saved for offline</dt><dd id="pStorage">–</dd>
    </dl>
    <p id="pMsg" class="msg"></p>
    <div class="btns"><button id="update" class="btn primary" type="button">Update now</button></div>
    <p class="small">Updates happen automatically when the app opens with a connection. Search always works from the copy saved on this phone.</p>
  </div>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Title or author" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search by title or author" disabled>
    <button id="clear" type="button" aria-label="Clear search" hidden>&times;</button>
  </div>
</header>
<main id="results" aria-live="polite"></main>
<div class="toast" id="toast" role="status" hidden><span id="toastText"></span></div>
<script src="app.js" defer></script>
</body>
</html>
