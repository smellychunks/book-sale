# Builds the container image and publishes it to GitHub's container registry (ghcr.io) whenever the app changes.
name: Build and publish image
on:
  push:
    branches: [main]
    paths: ["app/**", "nginx/**", "Dockerfile", ".github/workflows/build.yml"]
  workflow_dispatch: {}          # also lets you run it by hand from the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
