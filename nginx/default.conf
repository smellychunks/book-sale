# Serves the Book Sale app (read-only) and the library snapshot (read-only). Nothing else.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/manifest+json;

    # The app itself: always revalidate, so a new version is noticed.
    location / {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # The tiny pointer file: never cached anywhere.
    location = /data/version.json {
        alias /data/version.json;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store" always;
    }

    # Snapshots are named after their own hash, so they can be cached forever.
    location ~ "^/data/(snapshot\.[0-9a-f]{12}\.json)$" {
        alias /data/$1;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Nothing else in the data folder is ever served.
    location /data/ { return 404; }
    location ~ /\. { return 404; }
}
